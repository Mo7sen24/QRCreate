:root{--bg:#eef0e8;--ink:#2f3828;--panel:#fff;--line:#cfd5c3;--acc:#6f7d5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a12;--ink:#e6eadb;--panel:#1f261b;--line:#3a4533}}
:root[data-theme="dark"]{--bg:#151a12;--ink:#e6eadb;--panel:#1f261b;--line:#3a4533}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;font-size:17px;line-height:1.6}
h1,button,label{font-family:"Reem Kufi",Tahoma,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 4px}
.sub{margin:0 0 20px;opacity:.8}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.panel .wide{grid-column:1/-1}
label{display:block;font-size:15px;margin-bottom:2px}
input,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;color:inherit}
textarea{min-height:90px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{font-size:16px;padding:10px 20px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.alt{background:transparent;color:var(--ink)}
.note{font-size:15px;opacity:.75;margin:0}

.in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:27cqw 15cqw 13cqw}
.in p{margin:0}
.t1,.t2{font-weight:300;font-size:3.9cqw;line-height:1.5}
.t2{margin-top:2.5cqw!important}

.fam p{text-wrap:balance}
.fam i{font-style:normal;font-weight:300;font-size:3.4cqw}
.fam span{font-weight:300}.fam b{font-weight:400}
.inv{font-weight:300;font-size:3.2cqw}
.mw{width:37.5cqw;height:19.5cqw;margin:0 auto;color:#6b4e40}

.info{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5cqw;width:100%;font-size:3.2cqw;line-height:1.5;font-weight:300}
.info svg{width:6.5cqw;height:6.5cqw;color:#5a4034;margin-bottom:.5cqw}
.info b{display:block;font-weight:400}
.ban{font-size:3.1cqw;font-weight:300;line-height:1.5}
.nc{display:flex;gap:3cqw;justify-content:center;margin-top:1.2cqw}
.nc svg{width:6.5cqw;height:6.5cqw;fill:none;stroke:#5a4034;stroke-width:1.6;stroke-linecap:round}
.qrw{align-self:flex-start;display:flex;align-items:center;gap:3.5cqw;text-align:right}
.qr{line-height:0;border-radius:2.4cqw;overflow:hidden;box-shadow:0 0 0 1px rgba(79,54,43,.4)}
.qr svg,.qr img,.qr canvas{width:21cqw!important;height:21cqw!important;display:block}
.qt{display:flex;flex-direction:column;gap:.8cqw;align-items:flex-start}
.gst{font-weight:500;font-size:3.4cqw}
.one{font-weight:500;font-size:3.2cqw}
.code{font-family:ui-monospace,Menlo,monospace;direction:ltr;font-size:2.5cqw;letter-spacing:.5px}

<main>
<h1>كروت دعوة الفرح</h1>
<p class="sub">اكتب بيانات الفرح وعدد الدعوات، وكل دعوة هتطلع بـ QR مختلف.</p>
<section class="panel">
 <div><label for="gfam">عائلة العريس</label><input id="gfam" value="الشيخ علي عبد الجليل الهتار"></div>
 <div><label for="bfam">عائلة العروسة</label><input id="bfam" value="المهندس مدحت محمد العراقي"></div>
 <div><label for="groom">اسم العريس</label><input id="groom" value="حمزة"></div>
 <div><label for="bride">اسم العروسة</label><input id="bride" value="مريم"></div>
 <div><label for="day">اليوم</label><input id="day" value="الخميس"></div>
 <div><label for="date">التاريخ</label><input id="date" value="26.11.2026"></div>
 <div><label for="time">الساعة</label><input id="time" value="6:00 مساءً"></div>
 <div><label for="city">المنطقة</label><input id="city" value="القاهرة الجديدة"></div>
 <div class="wide"><label for="venue">المكان</label><input id="venue" value="فندق رينيسانس"></div>
 <div class="wide"><label for="count">عدد الدعوات</label><input id="count" type="number" min="1" max="500" value="20" inputmode="numeric"></div>
 <div class="wide"><label for="guests">أسماء المدعوين (اختياري، اسم في كل سطر)</label>
  <textarea id="guests" placeholder="سيبها فاضية لو عايز دعوات بدون أسماء"></textarea></div>
 <div class="wide actions">
  <button id="gen">إنشاء الكروت</button>
  <button id="print" class="alt">حفظ PDF للطباعة</button>
  <button id="copy" class="alt">نسخ قائمة الأكواد</button>
 </div>
 <p class="note wide" id="status">كل QR فيه كود فريد. الكود نفسه مكتوب تحت الـ QR لو الماسح ماقراش.</p>
</section>
<section id="cards" aria-live="polite"></section>

   Object.keys(m).forEach(function(key){c.querySelectorAll('[data-f="'+key+'"]').forEach(function(e){e.textContent=m[key]})});

 $("print").onclick=async function(){

   btn.disabled=true;
   if(document.fonts&&document.fonts.ready)await document.fonts.ready;
   var J=window.jspdf.jsPDF,CH=100,W=83,H=138.3,G=4,X0=(210-2*W-G)/2,Y0=(297-2*H-G)/2,parts=Math.ceil(cards.length/CH);
   for(var pt=0;pt<parts;pt++){
    var doc=new J({unit:"mm",format:"a4"}),sub=cards.slice(pt*CH,pt*CH+CH);
    for(var i=0;i<sub.length;i++){
     st.textContent="جاري تجهيز الكروت: "+(pt*CH+i+1)+" من "+cards.length;

     doc.addImage(cv.toDataURL("image/jpeg",.9),"JPEG",X0+(pos%2)*(W+G),Y0+Math.floor(pos/2)*(H+G),W,H);
    }

   }
   st.textContent="تم حفظ "+parts+" ملف PDF. كل صفحة فيها 4 كروت."
  }catch(e){st.textContent=(e&&e.code==="declined")?"":"حصلت مشكلة في الحفظ. افتح الصفحة في Chrome أو Safari وجرّب تاني."}
  btn.disabled=false;
 };
